# PesaCore — Release on Tag
#
# Triggers when a tag matching v*.*.* is pushed (e.g., v1.0.0).
# Builds release artifacts for both deploy targets (IIS on-prem, Linux for App Service)
# and creates a GitHub Release with the artifacts attached.
#
# This is the "build once, deploy many" pattern. The same artifact will move
# through staging-iis → prod-iis (or staging-azure → prod-azure) on the deploy
# pipeline, never rebuilt.
#
# the enterprise context: this is the paved-road release pipeline. Product teams
# tag a release; the platform-team-owned workflow does the rest. Same shape
# for cloud and on-prem; only the deploy target differs.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 1.0.0). Don't include the 'v' prefix."
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # required to create releases

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Build the IIS-ready artifact (Windows Server target).
  # ---------------------------------------------------------------------------
  build-iis:
    name: Build IIS artifact (win-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # tag is refs/tags/vX.Y.Z; strip the 'v' prefix
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Restore + Build + Publish (IIS)
        run: |
          dotnet publish the bankPrepApi.csproj \
            --configuration Release \
            -p:PublishProfile=IISProfile \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./publish/iis
        working-directory: ${{ github.workspace }}

      - name: Bundle IIS artifact
        run: |
          cd publish
          zip -r ../pesacore-iis-${{ steps.version.outputs.VERSION }}.zip iis/
        working-directory: ${{ github.workspace }}

      - name: Upload IIS bundle
        uses: actions/upload-artifact@v4
        with:
          name: pesacore-iis-${{ steps.version.outputs.VERSION }}
          path: pesacore-iis-${{ steps.version.outputs.VERSION }}.zip
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Build the Azure-friendly artifact (linux-x64 for App Service / containers).
  # ---------------------------------------------------------------------------
  build-azure:
    name: Build Azure artifact (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Publish (Linux, framework-dependent)
        run: |
          dotnet publish the bankPrepApi.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            -p:PublishReadyToRun=true \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./publish/linux
        working-directory: ${{ github.workspace }}

      - name: Bundle Linux artifact
        run: |
          cd publish
          zip -r ../pesacore-linux-${{ steps.version.outputs.VERSION }}.zip linux/
        working-directory: ${{ github.workspace }}

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: pesacore-linux-${{ steps.version.outputs.VERSION }}
          path: pesacore-linux-${{ steps.version.outputs.VERSION }}.zip
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Create the GitHub Release with both artifacts attached.
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-iis, build-azure]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download IIS bundle
        uses: actions/download-artifact@v4
        with:
          name: pesacore-iis-${{ steps.version.outputs.VERSION }}

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: pesacore-linux-${{ steps.version.outputs.VERSION }}

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          fi
          {
            echo "NOTES<<EOF"
            echo "## What changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Artifacts"
            echo ""
            echo "- **IIS / Windows Server:** \`pesacore-iis-${{ steps.version.outputs.VERSION }}.zip\` — extract to \`%SystemDrive%\\inetpub\\wwwroot\\bankprepapi\\\`"
            echo "- **Azure App Service / Linux:** \`pesacore-linux-${{ steps.version.outputs.VERSION }}.zip\` — \`az webapp deploy --src-path\`"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PesaCore ${{ steps.version.outputs.VERSION }}
          body: ${{ steps.notes.outputs.NOTES }}
          files: |
            pesacore-iis-${{ steps.version.outputs.VERSION }}.zip
            pesacore-linux-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
