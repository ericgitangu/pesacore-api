# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  STUB SECRET — PLACEHOLDER VALUES ONLY. DO NOT PUT REAL CREDENTIALS HERE.   ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# This file exists so the cluster has the *shape* of the Secret the app expects
# (the `ConnectionStrings__*` keys), letting the Deployments reference it without
# error. The values are deliberately fake.
#
# WHY a Secret and not a ConfigMap: connection strings carry credentials. A
# Secret is base64-wrapped (NOT encrypted by default) and treated as a distinct
# trust class — RBAC can restrict who reads Secrets, and it can be backed by an
# encryption-at-rest provider. base64 is encoding, not security; never treat a
# committed Secret manifest as safe to hold real values.
#
# HOW THIS WORKS IN PROD (none of these belong in git):
#   - GCP / Cloud Run  : Secret Manager, mounted via --set-secrets (see scripts/deploy.sh).
#   - Sealed Secrets   : commit an ENCRYPTED SealedSecret; the controller decrypts in-cluster.
#   - External Secrets : an ExternalSecret CR syncs from Secret Manager/Vault into a k8s Secret.
# In every case the plaintext lives in the vault, not the repo. This stub is the
# local-demo stand-in only.
apiVersion: v1
kind: Secret
metadata:
  name: pesacore-secrets
  namespace: pesacore
  labels:
    app.kubernetes.io/part-of: pesacore
type: Opaque
stringData:
  # stringData takes plaintext and k8s base64-encodes it on apply (more readable
  # than hand-encoding `data:`). PLACEHOLDER — the app falls back to in-memory
  # behaviour locally; this is here to demonstrate the wiring, not to connect.
  ConnectionStrings__Postgres: "Host=REPLACE_ME;Database=pesacore;Username=REPLACE_ME;Password=REPLACE_ME"
  ConnectionStrings__Redis: "REPLACE_ME:6379"
