# PesaCore edge — nginx reverse proxy / API gateway.
#
# Role: the local stand-in for Cloud Run's edge (prod) or an on-prem reverse
# proxy (IIS estate). It terminates TLS, applies the security envelope
# (HSTS + headers + rate limits), load-balances across scaled `pesacore-web`
# replicas, and forwards to the BFF — which itself reverse-proxies /api/* to
# the API. The browser only ever speaks TLS to this edge.
#
# NOT a prod artifact: prod = Cloud Run / managed LB. This demonstrates the
# patterns (TLS, headers, rate-limit, upstream LB) on the laptop. `nginx -t`
# is the structural check the caller must run (unavailable in this sandbox).

worker_processes auto;

events {
    # Headroom for the keepalive connections the upstream pool holds open.
    worker_connections 1024;
}

http {
    # ---- MIME + logging --------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Combined access log + a separate error log. In prod these ship to the
    # log pipeline; locally they're the first place to look when a 502 appears.
    log_format  edge  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent rt=$request_time '
                      'uct="$upstream_connect_time" urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  edge;
    error_log   /var/log/nginx/error.log   warn;

    # ---- Connection hygiene ---------------------------------------------
    sendfile      on;
    tcp_nopush    on;          # coalesce headers + file start into one packet
    tcp_nodelay   on;          # but don't delay small interactive responses
    keepalive_timeout  65s;
    server_tokens off;         # WHY: don't advertise the nginx version — cuts
                               # version-specific recon. Defense by obscurity is
                               # weak alone but free here.

    # ---- Body size limit -------------------------------------------------
    # WHY: a hard ceiling on request bodies caps memory/disk per request and
    # blunts a class of resource-exhaustion DoS (giant uploads). PesaCore is a
    # JSON API + a WASM SPA — no large uploads — so 10m is generous.
    client_max_body_size 10m;
    client_body_timeout  10s;  # slow-body (Slowloris-style) defense
    client_header_timeout 10s;

    # ---- Compression -----------------------------------------------------
    # WHY: shrinks the multi-MB Blazor WASM runtime + JSON payloads → faster
    # loads, less egress. brotli (if the module is compiled in) beats gzip on
    # text; gzip is the universal fallback.
    #
    # BREACH caveat (see security_hardening_cheatsheet.md §Compression): never
    # compress a response that mingles a secret (CSRF token) with reflected
    # user input. PesaCore's BFF keeps tokens server-side, so this is safe here.
    gzip              on;
    gzip_vary         on;       # emit `Vary: Accept-Encoding` so caches key correctly
    gzip_comp_level   6;        # CPU/ratio sweet spot
    gzip_min_length   1024;     # don't bother compressing tiny responses
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/wasm image/svg+xml font/woff font/woff2;

    # brotli is opt-in: it's only available if the nginx image ships the
    # ngx_brotli module. The stock `nginx:` image does NOT. To enable, swap the
    # compose image for one with brotli (e.g. fholzer/nginx-brotli) and
    # uncomment. Left commented so this config loads on the stock image.
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css application/javascript application/json
    #                   application/wasm image/svg+xml font/woff2;

    # ---- Rate limiting (token-bucket via leaky-bucket zones) -------------
    # WHY: cap requests per client IP. The edge limit is blanket abuse/DoS and
    # brute-force defense; per-tenant business limits live in-app. Two zones:
    #   - `general` for the SPA/static surface (looser; a page pulls many assets)
    #   - `api`     for /api/* (tighter; these hit the backend + downstreams)
    # 10m of shared memory tracks ~160k distinct IPs per zone.
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=10r/s;

    # Connection cap per IP — blunts connection-exhaustion / Slowloris.
    limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

    # When a limit trips, return 429 (not the default 503) so clients can
    # back off correctly. 503 implies "server down"; 429 means "you, slow down".
    limit_req_status  429;
    limit_conn_status 429;

    # ---- TLS (shared across server blocks) -------------------------------
    # WHY ssl_protocols TLSv1.2 TLSv1.3: 1.2 is the compliance floor (PCI DSS /
    # regulated estates); 1.3 is faster (1-RTT) and drops legacy ciphers. SSL3/
    # TLS1.0/1.1 are broken (POODLE/BEAST) and fail audits — excluded entirely.
    # The on-prem analogue is the SCHANNEL registry decision (the on-prem SCHANNEL TLS-1.2 work);
    # at the edge it's this one directive.
    ssl_protocols           TLSv1.2 TLSv1.3;

    # WHY ssl_prefer_server_ciphers off: with TLS 1.3 the client's cipher
    # preference is honored (the modern guidance) and the 1.3 suites are all
    # AEAD/strong — there's no weak option to force off the client. Forcing
    # server order is the old 1.2-era workaround for weak-client suites.
    ssl_prefer_server_ciphers off;

    # Modern 1.2 cipher list (1.3 suites are fixed by the protocol and need no
    # listing): ECDHE for forward secrecy, AES-GCM/CHACHA20 AEAD only — no CBC,
    # no RSA key exchange, no 3DES.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Session cache cuts handshake cost on repeat visits. Tickets OFF so a
    # leaked ticket key can't retroactively decrypt past sessions (forward
    # secrecy preserved).
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    # ---- Upstream: load-balance scaled `pesacore-web` replicas -----------
    # WHY: `docker compose up --scale pesacore-web=3` gives three containers
    # behind the compose-network DNS name `pesacore-web`. nginx's `resolver`
    # + the upstream below let it spread requests across them — a real local
    # LB, no k8s. Default policy is round-robin; least_conn is kinder when
    # request cost is uneven (some hit the API, some are cheap static).
    #
    # NOTE: nginx resolves upstream names ONCE at startup unless told otherwise.
    # With docker scaling, replicas come and go — so we resolve the service name
    # dynamically (see the `set` + variable `proxy_pass` in the location blocks)
    # via Docker's embedded DNS at 127.0.0.11. The static `upstream` block below
    # is the simpler form that works when the replica set is fixed at boot.
    upstream pesacore_web {
        # `pesacore-web` resolves to all replica IPs; nginx round-robins.
        server pesacore-web:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;          # reuse upstream connections — avoid per-request TCP setup
    }

    include /etc/nginx/conf.d/*.conf;
}
