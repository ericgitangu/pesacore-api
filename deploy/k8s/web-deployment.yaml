# pesacore-web — the BFF + Blazor WASM front end. Listens on :8080, serves the SPA
# and reverse-proxies /api/* to the API Service. The browser only ever talks to
# this origin (via the Ingress) — no CORS, no API URL in the client.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pesacore-web
  namespace: pesacore
  labels:
    app.kubernetes.io/name: pesacore-web
    app.kubernetes.io/part-of: pesacore
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pesacore-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pesacore-web
    spec:
      containers:
        - name: pesacore-web
          image: pesacore-web:linux       # locally built + `k3d image import`ed
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Upstream API target = the API Service's in-cluster DNS name. This is
            # the k8s analogue of the compose `PesaCore__BaseUrl: http://pesacore:8080`
            # line — service discovery by name, resolved by cluster DNS (CoreDNS).
            - name: PesaCore__BaseUrl
              value: "http://pesacore-api:8080"
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: pesacore-config
          # /healthz is the BFF's own liveness/readiness endpoint (matches compose).
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
