name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build + test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PesaCore.slnx
      - name: Build (Release)
        run: dotnet build PesaCore.slnx -c Release --no-restore
      - name: Test
        run: dotnet test PesaCore.slnx -c Release --no-build --verbosity normal
