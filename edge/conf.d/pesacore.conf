# PesaCore edge server blocks.
#   :80  → permanent redirect to :443 (no plaintext app traffic)
#   :443 → TLS termination + security envelope + LB to pesacore-web replicas
#
# Reachable on the host as :8081 (http) and :8443 (https) per the compose
# port maps. So: https://localhost:8443  (accept the self-signed cert warning).

# ---- :80 — redirect everything to HTTPS ---------------------------------
# WHY: never serve the app over plaintext. The 301 closes the http window;
# HSTS (set on the https side) makes browsers skip http entirely on later
# visits. We do NOT set HSTS here — a header on a plaintext response is
# ignored by spec, and setting it on http is a no-op at best.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name localhost;

    # ACME http-01 challenge path would live here in prod (Let's Encrypt);
    # local self-signed needs none. Everything else → https.
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# ---- :443 — the real edge ------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;             # WHY: multiplexed streams — big win for the
                                # many small asset requests a WASM SPA fires.
    server_name localhost;

    # Self-signed localhost cert (generate via the openssl one-liner in
    # docs/edge_nginx.md). Mounted read-only into the container at /etc/nginx/certs.
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Docker's embedded DNS — needed so the variable proxy_pass below
    # re-resolves `pesacore-web` as replicas scale up/down at runtime.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Security headers (defense-in-depth) -----------------------------
    # `always` is load-bearing: without it, add_header is SKIPPED on error
    # responses (4xx/5xx) and redirects — exactly the responses an attacker can
    # often trigger. `always` applies the header on every status code.

    # HSTS: "only ever reach me over HTTPS for 2 years". Kills SSL-strip /
    # downgrade MITM. `preload` bakes it into browsers so even the FIRST visit
    # is HTTPS — but it's a one-way door (long max-age, subdomain-wide), so it's
    # a deliberate commitment, not a default. Only ever sent on the https block.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Stop the browser MIME-sniffing a response into a different type
    # (e.g. treating a JSON/text response as executable script).
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking: forbid framing this origin entirely. CSP frame-ancestors
    # (below) is the modern equivalent; X-Frame-Options covers older browsers.
    add_header X-Frame-Options "DENY" always;

    # Leak less in the Referer header on cross-origin navigations: send the
    # origin only (no path/query) when leaving to another site.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable browser features the app doesn't use — shrinks the attack surface
    # of a compromised page (no camera/mic/geolocation/payment-request abuse).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP — the big XSS lever. This is a WORKING policy for a Blazor WASM SPA:
    #   default-src 'self'          : only same-origin by default
    #   script-src  'self' 'wasm-unsafe-eval'
    #                               : Blazor WASM REQUIRES 'wasm-unsafe-eval' to
    #                                 JIT/instantiate the .wasm runtime. WITHOUT
    #                                 it the app will not boot. ('unsafe-eval'
    #                                 would also work but is broader — prefer the
    #                                 wasm-scoped keyword.)
    #   style-src   'self' 'unsafe-inline'
    #                               : Blazor injects some inline styles; tighten
    #                                 to a nonce/hash later if you want zero
    #                                 'unsafe-inline'. Documented trade-off.
    #   connect-src 'self'          : the BFF proxies /api on the SAME origin, so
    #                                 the browser never needs a cross-origin
    #                                 connect — 'self' suffices (no CORS either).
    #   img/font-src 'self' data:   : allow inline data: for small assets
    #   frame-ancestors 'none'      : modern clickjacking defense (pairs with XFO)
    #   base-uri 'self'; form-action 'self'; object-src 'none'
    #                               : block <base> hijack, off-origin form posts,
    #                                 and legacy plugin objects.
    # script-src includes 'unsafe-inline' for Blazor WASM's inline <script type="importmap">
    # (without it the runtime hangs at "Initializing runtime…"). Prod-harden with a hash/nonce.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- Connection cap --------------------------------------------------
    # NOT set at the server level: a server-level limit_conn is INHERITED by every
    # location, including /_framework/, so a cold WASM boot opening many parallel
    # connections could trip it (limit_conn_status = 429) — the same class of bug as
    # rate-limiting static assets. Apply it only to the dynamic /api surface below.

    # Common proxy headers, factored once. WHY each:
    #   Host                : preserve the original host so the app routes/links right
    #   X-Real-IP / X-Forwarded-For : the app sees the CLIENT ip, not nginx's —
    #                         required for the app's own per-tenant rate limiting,
    #                         audit logs, and `AllowedHosts`/forwarded-headers logic.
    #   X-Forwarded-Proto https : tells the app the EXTERNAL scheme is https even
    #                         though the hop to the container is http — so the app
    #                         generates https links and its UseHsts()/redirect
    #                         logic behaves. Without this the BFF thinks it's http.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;            # required for upstream keepalive
    proxy_set_header Connection "";    # clear hop-by-hop header for keepalive reuse

    # Sensible upstream timeouts — fail fast rather than hang a worker.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ---- Routing ---------------------------------------------------------

    # /api/* — the dynamic, authenticated surface. Tighter rate limit, NO cache.
    # The BFF (pesacore-web) reverse-proxies these to the API in turn.
    location /api/ {
        limit_req zone=api burst=20 nodelay;   # allow short bursts, no queuing delay
        limit_conn conn_per_ip 20;             # concurrency cap — DYNAMIC surface only, not static

        # WHY no-store: API responses are authenticated / may carry PII or
        # represent mutations — caching them anywhere (browser, proxy) risks
        # serving one user's data to another or replaying a stale balance.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;   # re-apply (add_header doesn't inherit here)

        # Variable proxy_pass forces per-request DNS re-resolution via `resolver`
        # so newly-scaled replicas are picked up without an nginx reload.
        set $web_upstream pesacore-web:8080;
        proxy_pass http://$web_upstream;
    }

    # /_framework/* and other content-hashed Blazor assets — immutable, far-future.
    # WHY safe: Blazor fingerprints these (e.g. dotnet.[hash].wasm); the URL
    # changes when content changes, so an immutable cache can never go stale.
    # `immutable` also tells the browser to skip even the revalidation request.
    location /_framework/ {
        # NO rate limit here: a Blazor WASM boot fetches 60+ immutable framework
        # assets in ONE HTTP/2 burst. Rate-limiting them returns 429s, the runtime
        # can't load the missing assemblies, and the app dies with "a runtime error
        # occurred". Rate limiting defends the DYNAMIC /api surface, not static files
        # (those are protected by the immutable cache + the LB). Found via the 429 log.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        set $web_upstream pesacore-web:8080;
        proxy_pass http://$web_upstream;
    }

    # Other static assets (css/js/img/fonts) — long cache but NOT immutable,
    # since non-fingerprinted files can change under the same URL. A day is a
    # safe balance; revalidation kicks in after.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        # No rate limit on static assets either — same burst reasoning as /_framework/.
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/conf.d/security-headers.inc;
        set $web_upstream pesacore-web:8080;
        proxy_pass http://$web_upstream;
    }

    # Everything else (the SPA shell, index.html, /healthz) — general limit,
    # no caching of the entry document so deploys are picked up immediately.
    location / {
        limit_req zone=general burst=30 nodelay;
        add_header Cache-Control "no-cache" always;   # revalidate the shell each load
        include /etc/nginx/conf.d/security-headers.inc;
        set $web_upstream pesacore-web:8080;
        proxy_pass http://$web_upstream;
    }
}
